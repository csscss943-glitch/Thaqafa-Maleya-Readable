مة المال ترتبط بندرته النسبية، فإذا زادت كمية النقود بشكل مفرط دون زيادة الإنتاج تنخفض قيمتها ويحدث التضخم. لذلك تحرص السياسة النقدية على التوازن بين كمية النقد وحجم المبادلات الحقيقية."}]},{id:2,title:"دور التمويل في الاقتصاد",questions:[{q:"ما هو مفهوم التمويل وأنواعه؟",a:"التمويل هو توفير الموارد المالية اللازمة لتمويل أنشطة الأفراد والمؤسسات. أنواعه: تمويل ذاتي من مدخرات المشروع، وتمويل خارجي مباشر (أسهم) أو غير مباشر (قروض بنكية)، وتمويل قصير ومتوسط وطويل الأجل."},{q:"ما الفرق بين التمويل المباشر وغير المباشر؟",a:"التمويل المباشر يتم عبر السوق المالي ببيع أسهم أو سندات مباشرة للمستثمرين دون وسيط بنكي. أما غير المباشر فيتم عبر البنوك حيث تجمع الودائع وتمنحها كقروض، وتتحمل البنوك مخاطر الوساطة."},{q:"ما هو دور السوق المالي في تعبئة الادخار؟",a:"السوق المالي يحول الادخار الصغير المتفرق لدى الأسر إلى استثمارات منتجة كبيرة للمقاولات، عبر أدوات كالأسهم والسندات، مما يمول النمو الاقتصادي ويوفر عوائد للمدخرين."},{q:"كيف يساهم التمويل في خلق القيمة المضافة؟",a:"عندما يمول المشروع شراء آلات ومواد أولية وتشغيل عمال، ينتج سلعا قيمتها أعلى من تكلفة مدخلاتها. هذا الفارق هو القيمة المضافة التي توزع كأجور وأرباح وضرائب وتساهم في الناتج الداخلي."},{q:"ما هي مصادر تمويل المقاولة المغربية؟",a:"مصادرها: رأس المال الخاص للمؤسسين، الأرباح المحتجزة، الاقتراض البنكي، إصدار الأسهم في البورصة، القروض التشاركية، برامج دعم الدولة كبرنامج انطلاقة، والتمويل من المستثمرين الملائكة."},{q:"ما هي مخاطر الإفراط في الاستدانة؟",a:"الإفراط في القروض يرفع عبء الفوائد، يضعف استقلال المقاولة، يجعلها عرضة للإفلاس عند تراجع المبيعات، ويخفض تصنيفها الائتماني مما يصعب حصولها على تمويل جديد مستقبلا."},{q:"ما علاقة التمويل بالتنمية المستدامة؟",a:"التمويل المستدام يوجه الأموال نحو مشاريع تحترم البيئة والمجتمع (طاقات متجددة، تدوير النفايات)، عبر قروض خضراء وسندات خضراء، مما يحقق ربحا اقتصاديا مع حماية الموارد للأجيال القادمة."}]},{id:3,title:"البنية الأساسية للنظام المالي",questions:[{q:"ما هي مكونات النظام المالي المغربي؟",a:"يتكون من: بنك المغرب (البنك المركزي)، البنوك التجارية والتشاركية، سوق القيم المنقولة (بورصة الدار البيضاء)، شركات التأمين، مؤسسات الائتمان، هيئة مراقبة التأمينات والاحتياط الاجتماعي، والهيئة المغربية لسوق الرساميل."},{q:"ما هو دور بنك المغرب في استقرار الأسعار؟",a:"بنك المغرب يضع السياسة النقدية عبر التحكم في سعر الفائدة الرئيسي ونسبة الاحتياطي الإلزامي، بهدف إبقاء التضخم تحت 2%، مما يحافظ على القدرة الشرائية للدرهم وثقة المستثمرين."},{q:"ما الفرق بين البنوك التقليدية والبنوك التشاركية؟",a:"البنوك التقليدية تعمل بالفائدة (ربا) إقراضا واقتراضا. أما التشاركية فتعمل بمبدأ المشاركة في الربح والخسارة عبر عقود كالمرابحة والمضاربة والإجارة، وتلتزم بضوابط الشريعة الإسلامية مع رقابة شرعية."},{q:"ما هو دور بورصة الدار البيضاء؟",a:"البورصة سوق منظمة لبيع وشراء الأسهم والسندات، تمكن المقاولات من جمع رأس المال، وتوفر للمستثمرين سيولة عبر إمكانية البيع السريع، وتعكس صحة الاقتصاد عبر مؤشر مازي."},{q:"ما أهمية الشمول المالي في المغرب؟",a:"الشمول المالي يعني وصول جميع المواطنين لخدمات بنكية بأسعار مناسبة (حسابات، دفع عبر الهاتف، قروض صغيرة). يقلل الاقتصاد غير المهيكل، يحارب الفقر، ويمكن الشباب والمقاولين الذاتيين من الاندماج."}]},{id:4,title:"الزكاة والمالية الإسلامية",questions:[{q:"ما هي الزكاة وشروط وجوبها؟",a:"الزكاة ركن من أركان الإسلام، حق مالي واجب في أموال الأغنياء للفقراء. شروطها: الإسلام، الحرية، بلوغ النصاب (85غ ذهب)، حولان الحول (سنة قمرية)، والملك التام للمال النامي."},{q:"ما هي الأموال التي تجب فيها الزكاة؟",a:"تجب في: النقد والذهب والفضة، عروض التجارة، الزروع والثمار (العشر)، الأنعام (الإبل والبقر والغنم)، الركاز والمعادن، وزكاة الفطر في رمضان على كل مسلم."},{q:"ما هي مصارف الزكاة الثمانية؟",a:"حددها القرآن: الفقراء، المساكين، العاملين عليها، المؤلفة قلوبهم، في الرقاب (تحرير العبيد)، الغارمين (المدينون)، في سبيل الله، وابن السبيل (المسافر المنقطع)."},{q:"ما الفرق بين الزكاة والضريبة؟",a:"الزكاة عبادة مالية دينية ثابتة النسبة والمصارف ومقرونة بالنية، تهدف للتطهير والتكافل. الضريبة التزام قانوني مدني تفرضه الدولة لتمويل المرافق العامة وتختلف نسبتها حسب السياسة المالية."},{q:"ما هو دور الوقف في التنمية المالية الإسلامية؟",a:"الوقف حبس أصل وتسبيل منفعته (مدرسة، مستشفى، أرض زراعية). يوفر تمويلا مستداما غير ربحي للخدمات الاجتماعية، ويقلل العبء على ميزانية الدولة، وكان أساس الجامعات كالقرويين."},{q:"كيف تحارب المالية الإسلامية الربا والغرر؟",a:"تحرم الربا لأنه ظلم واستغلال لحاجة المقترض، وتحرم الغرر (الجهالة الكبيرة) والميسر. تستبدلهما بعقود قائمة على البيع الحقيقي والمشاركة والمخاطرة المشتركة والشفافية الكاملة في العقد."}]},{id:5,title:"ملكية المشاريع وأنواع الشركات",questions:[{q:"ما هي أنواع المقاولات حسب الملكية؟",a:"مقاولة فردية يملكها شخص واحد، شركة أشخاص تقوم على الثقة الشخصية (تضامن، توصية بسيطة)، وشركة أموال تقوم على رأس المال (مساهمة، ذات مسؤولية محدودة)، وتعاونيات ومقاولات عمومية."},{q:"ما هي خصائص الشركة ذات المسؤولية المحدودة SARL؟",a:"أكثر شكل منتشر في المغرب: شريكان على الأقل، رأس مال حر، مسؤولية الشريك محدودة بقدر حصته، لا تحتاج لحد أدنى كبير، تسييرها سهل، مناسبة للمشاريع الصغيرة والمتوسطة والعائلية."},{q:"ما الفرق بين شركة المساهمة SA وذات المسؤولية المحدودة؟",a:"المساهمة تتطلب 5 مساهمين و3 مليون درهم كحد أدنى إذا كانت تدعو للاكتتاب العام، وأسهمها قابلة للتداول في البورصة وتخضع لتدقيق صارم. SARL أبسط وأصغر ولا تطرح أسهمها للعموم."},{q:"ما هي مزايا المقاولة الذاتية في المغرب؟",a:"نظام مبسط أطلقه المغرب: تسجيل مجاني، ضريبة جزافية منخفضة (0.5% للخدمات)، لا محاسبة معقدة، سقف رقم معاملات 500 ألف درهم للخدمات، تمكن الشباب والحرفيين من العمل القانوني والاستفادة من التغطية الاجتماعية."},{q:"كيف يتم اختيار الشكل القانوني المناسب للمشروع؟",a:"الاختيار حسب: حجم رأس المال، عدد الشركاء، حجم المخاطر (هل أريد مسؤولية محدودة؟)، الحاجة لدخول البورصة، النظام الضريبي، وسهولة التسيير. المشروع الصغير يناسبه ذاتي أو SARL، والكبير SA."}]},{id:6,title:"النفقات والميزانية",questions:[{q:"ما هو تعريف الميزانية الشخصية وأهميتها؟",a:"الميزانية خطة تقديرية للإيرادات والنفقات خلال فترة (شهر/سنة). أهميتها: التحكم في الإنفاق، تجنب الديون، تحقيق أهداف (شراء منزل، دراسة)، وقياس الفجوة بين الدخل والمصاريف لتصحيحها."},{q:"ما هي قاعدة 50/30/20 في تقسيم الميزانية؟",a:"قاعدة مشهورة: 50% من الدخل للحاجات الأساسية (سكن، أكل، نقل)، 30% للرغبات والترفيه، 20% للادخار وسداد الديون والاستثمار. تساعد على التوازن وعدم الإسراف."},{q:"ما الفرق بين النفقات الثابتة والمتغيرة؟",a:"الثابتة تبقى نفسها شهريا (كراء، قسط قرض، اشتراك إنترنت). المتغيرة تتغير حسب الاستهلاك (مطاعم، ملابس، بنزين). التحكم في المتغيرة أسهل لتوفير المال بسرعة."},{q:"ما هي ميزانية الدولة وأنواعها؟",a:"ميزانية الدولة وثيقة قانونية (قانون المالية) تقدر مداخيل الدولة (ضرائب، جمارك) ونفقاتها (أجور، استثمار، دعم) لسنة. قد تكون متوازنة أو فيها عجز (نفقات أكبر) أو فائض."},{q:"كيف تعالج الدولة عجز الميزانية؟",a:"تعالجه بـ: ترشيد النفقات، تحسين تحصيل الضرائب ومحاربة التهرب، الاقتراض الداخلي والخارجي، إصدار سندات الخزينة، وتشجيع النمو لزيادة المداخيل الضريبية دون رفع النسب."},{q:"ما هو مفهوم التضخم وأثره على الميزانية الأسرية؟",a:"التضخم هو الارتفاع المستمر العام للأسعار، يخفض القدرة الشرائية لنفس الراتب. الأسر تحتاج لزيادة الدخل أو تقليل الكميات أو البحث عن بدائل أرخص للحفاظ على نفس مستوى المعيشة."}]},{id:7,title:"العقود والمعاملات المالية",questions:[{q:"ما هو العقد وشروط صحته؟",a:"العقد توافق إرادتين لإنشاء التزام. شروط صحته: الأهلية (بالغ عاقل)، الرضا دون إكراه أو تدليس، محل مشروع وممكن، وسبب مشروع. العقد شريعة المتعاقدين إذا احترم القانون."},{q:"ما هي أهم العقود المالية في الحياة اليومية؟",a:"عقد البيع والشراء، عقد الكراء، عقد العمل، عقد القرض، عقد التأمين، عقد الشركة، عقد المرابحة في البنوك التشاركية، وعقود الخدمات الرقمية (اشتراكات) التي يجب قراءة بنودها جيدا."},{q:"ما هي حقوق المستهلك المالي في المغرب؟",a:"حماها القانون: الحق في الإعلام المسبق عن سعر الفائدة والتكاليف، الحق في فترة تفكير، الحق في الحصول على نسخة العقد، الحق في الشكاية لدى بنك المغرب، ومنع البنود التعسفية والبيع بالإكراه."}]},{id:8,title:"ريادة الأعمال والمقاولة",questions:[{q:"ما الفرق بين المقاول ورائد الأعمال؟",a:"المقاول قد يفتح مشروعا تقليديا قائما (مقهى، متجر) بهدف الربح. رائد الأعمال يبتكر حلا جديدا لمشكلة قائمة، يخاطر أكثر، يستهدف نمو سريع وقابل للتوسع، ويعتمد على التكنولوجيا والابتكار."},{q:"ما هي مراحل إنشاء مشروع ريادي؟",a:"1- تحديد فكرة وحاجة السوق (دراسة سوق)، 2- نموذج العمل التجاري Business Model، 3- نموذج أولي MVP، 4- خطة عمل وتمويل، 5- إنشاء قانوني، 6- إطلاق وتسويق، 7- قياس وتصحيح مستمر."},{q:"ما هو نموذج العمل التجاري Business Model Canvas؟",a:"لوحة من 9 خانات تلخص المشروع: القيمة المقترحة، العملاء المستهدفون، القنوات، العلاقة، الإيرادات، الموارد الرئيسية، الأنشطة، الشركاء، وهيكل التكاليف. أداة بصرية سريعة لاختبار الفكرة."},{q:"ما هي أسباب فشل أغلب المشاريع الناشئة؟",a:"أسباب شائعة: غياب حاجة سوقية حقيقية، نفاد السيولة، فريق ضعيف، تسعير خاطئ، منافسة قوية، إهمال التسويق الرقمي، وعدم الاستماع لملاحظات الزبائن المبكرة."}]},{id:9,title:"الاستثمار والادخار",questions:[{q:"ما هو الفرق بين الادخار والاستثمار؟",a:"الادخار هو اقتطاع جزء من الدخل والاحتفاظ به سائلا آمنا (دفتر توفير) لمواجهة الطوارئ. الاستثمار هو توظيف المدخرات في أصول تنمو (أسهم، عقار، مشروع) مع تحمل مخاطرة للحصول على عائد أعلى على المدى الطويل."},{q:"ما هي القاعدة الذهبية للاستثمار: العائد مقابل المخاطرة؟",a:"كلما زاد العائد المتوقع زادت المخاطرة. الوديعة البنكية آمنة لكن عائدها 2%. الأسهم عائدها قد يصل 15% لكن قد تخسر. لذلك يجب تنويع المحفظة وعدم وضع كل البيض في سلة واحدة."},{q:"ما هو الاستثمار العقاري ومزاياه في المغرب؟",a:"شراء عقار للكراء أو إعادة البيع. مزاياه: أصل ملموس، دخل شهري مستقر، يحمي من التضخم، يستفيد من دعم السكن الاجتماعي. عيوبه: يحتاج رأس مال كبير وسيولة بطيئة ومصاريف صيانة وضرائب."},{q:"ما هو مفهوم الفائدة المركبة وسحرها؟",a:"الفائدة المركبة تعني أن الأرباح نفسها تربح. مثلا 10 آلاف درهم بفائدة 8% تصبح بعد 20 سنة 46 ألفا بسبب التراكم. أينشتاين سماها الأعجوبة الثامنة. كلما بدأت الاستثمار مبكرا استفدت أكثر."},{q:"كيف تتجنب النصب المالي والاحتيال الاستثماري؟",a:"احذر وعود ربح مضمون 30% شهريا، أو شركات غير مرخصة من AMMC، أو الضغط للإيداع الفوري. تحقق من الترخيص، افهم المنتج، لا تستثمر ما لا تتحمل خسارته، واستشر خبيرا مستقلا قبل التوقيع."}]},{id:10,title:"الذكاء الاصطناعي ومستقبل الأعمال",questions:[{q:"كيف يغير الذكاء الاصطناعي القطاع المالي؟",a:"يغيره عبر: روبوتات دردشة للخدمة 24/7، كشف الاحتيال البنكي بالتعلم الآلي، تقييم مخاطر القروض بسرعة، مستشارون آليون للاستثمار (Robo-Advisors)، وتداول خوارزمي، مما يخفض التكلفة ويحسن تجربة الزبون ويخلق وظائف جديدة كمحلل بيانات."},{q:"ما هي المهارات المالية المطلوبة لجيل الذكاء الاصطناعي؟",a:"الجيل الجديد يحتاج: محو أمية رقمية ومالية معا، تحليل البيانات، البرمجة بلغة بايثون، التفكير النقدي لكشف الأخبار المالية المزيفة، ريادة الأعمال الرقمية، وأخلاقيات الذكاء الاصطناعي وحماية المعطيات الشخصية طبقا لقانون 09-08."}]}];function ei(){let[e,n]=Le.useState(0),[t,r]=Le.useState(""),[l,o]=Le.useState(!1),[u,i]=Le.useState(!0),[s,f]=Le.useState(()=>{let g={};return Fn.forEach((w)=>w.questions.forEach((_,N)=>g[`${w.id}-${N}`]=!0)),g}),[m,v]=Le.useState(!1),[p,S]=Le.useState(0),E=Le.useMemo(()=>Fn.reduce((g,w)=>g+w.questions.length,0),[]),k=Le.useMemo(()=>{if(!t.trim())return Fn;let g=t.toLowerCase();return Fn.map((w)=>({...w,questions:w.questions.filter((_)=>_.q.toLowerCase().includes(g)||_.a.toLowerCase().includes(g))})).filter((w)=>w.questions.length>0)},[t]),T=k[e]??k[0],c=!!t.trim(),a=(g)=>{f((w)=>({...w,[g]:!w[g]}))},d=()=>{let g=!u;i(g);let w={};Fn.forEach((_)=>_.questions.forEach((N,D)=>w[`${_.id}-${D}`]=g)),f(w)},y=(g)=>{n(g),S((w)=>w+1),setTimeout(()=>{document.getElementById("content-start")?.scrollIntoView({behavior:"smooth",block:"start"})},50)};return x("div",{dir:"rtl",className:"min-h-screen text-white overflow-x-clip",style:{background:"#0a1931",paddingTop:"var(--safe-area-inset-top)",fontFamily:"'Cairo', system-ui, sans-serif",boxSizing:"border-box"},children:[P("style",{children:`
